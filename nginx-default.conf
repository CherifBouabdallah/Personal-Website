server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html index.htm;

    server_name _;

    # Vite's hashed build output (/assets/*.js, *.css) — filename changes on
    # every content change, so it's safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static assets copied verbatim from public/ (fonts, images) — not
    # content-hashed, so cache for a week rather than forever.
    location ~* \.(?:woff2?|ttf|otf|webp|png|jpe?g|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
